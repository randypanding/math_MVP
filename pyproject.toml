[project]
name = "math-practice-generator"
version = "0.1.0"
description = "小学数学专题练习卷生成器"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "weasyprint>=60.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "requests>=2.31",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
mathgen = "src.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-system = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
